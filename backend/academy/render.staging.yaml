services:
  - type: web
    name: redline-academy-staging
    env: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.academy.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: ACADEMY_CORS_ORIGINS
        value: https://staging.redline-sim.com
